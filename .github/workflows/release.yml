name: Release Native GPUI Builds (macOS & Windows)

on:
  push:
    tags:
      - "v*"
  workflow_dispatch:

jobs:
  verify:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: dtolnay/rust-toolchain@stable
        with:
          components: clippy
      - uses: swatinem/rust-cache@v2
      - name: Install Linux GPUI build dependencies
        run: |
          sudo apt-get update
          sudo apt-get install -y libasound2-dev libfontconfig1-dev libwayland-dev libxkbcommon-dev libxkbcommon-x11-dev libxcb1-dev libvulkan-dev pkg-config
      - name: Run Rust workspace tests
        run: cargo test --workspace
      - name: Run Rust workspace clippy
        run: cargo clippy --workspace --all-targets -- -D warnings

  build:
    needs: verify
    permissions:
      contents: write
    strategy:
      fail-fast: false
      matrix:
        include:
          - platform: windows-latest
            target: x86_64-pc-windows-msvc
            artifact_name: sterm-gpui-windows-x86_64
          - platform: macos-latest
            target: aarch64-apple-darwin
            artifact_name: sterm-gpui-macos-aarch64
          - platform: macos-latest
            target: x86_64-apple-darwin
            artifact_name: sterm-gpui-macos-x86_64

    runs-on: ${{ matrix.platform }}

    steps:
      - uses: actions/checkout@v4

      - uses: dtolnay/rust-toolchain@stable
        with:
          targets: ${{ matrix.target }}

      - uses: swatinem/rust-cache@v2

      - name: Run unit tests
        run: cargo test --workspace

      - name: Build native GPUI release binary
        run: cargo build --release -p sterm-gpui --target ${{ matrix.target }}

      - name: Package Windows bundle
        if: runner.os == 'Windows'
        shell: pwsh
        run: |
          New-Item -ItemType Directory -Force -Path dist-release
          Copy-Item "target/${{ matrix.target }}/release/sterm-gpui.exe" "dist-release/sterm-gpui.exe"
          Compress-Archive -Path "dist-release/sterm-gpui.exe" -DestinationPath "dist-release/${{ matrix.artifact_name }}.zip" -Force

      - name: Package macOS .app bundle
        if: runner.os == 'macOS'
        shell: bash
        run: |
          set -euo pipefail
          APP_DIR="dist-release/STerm SSH.app"
          mkdir -p "$APP_DIR/Contents/MacOS" "$APP_DIR/Contents/Resources"
          cp "target/${{ matrix.target }}/release/sterm-gpui" "$APP_DIR/Contents/MacOS/sterm-gpui"
          chmod +x "$APP_DIR/Contents/MacOS/sterm-gpui"
          cat > "$APP_DIR/Contents/Info.plist" <<'PLIST'
          <?xml version="1.0" encoding="UTF-8"?>
          <!DOCTYPE plist PUBLIC "-//Apple//DTD PLIST 1.0//EN" "http://www.apple.com/DTDs/PropertyList-1.0.dtd">
          <plist version="1.0">
          <dict>
            <key>CFBundleName</key>
            <string>STerm SSH</string>
            <key>CFBundleDisplayName</key>
            <string>STerm SSH</string>
            <key>CFBundleIdentifier</key>
            <string>app.sterm.ssh</string>
            <key>CFBundleVersion</key>
            <string>0.1.0</string>
            <key>CFBundleShortVersionString</key>
            <string>0.1.0</string>
            <key>CFBundleExecutable</key>
            <string>sterm-gpui</string>
            <key>CFBundlePackageType</key>
            <string>APPL</string>
            <key>NSHighResolutionCapable</key>
            <true/>
          </dict>
          </plist>
          PLIST
          tar -C dist-release -czf "dist-release/${{ matrix.artifact_name }}.tar.gz" "STerm SSH.app"

      - name: Upload workflow artifact
        uses: actions/upload-artifact@v4
        with:
          name: ${{ matrix.artifact_name }}
          path: |
            dist-release/*.zip
            dist-release/*.tar.gz

      - name: Publish draft GitHub Release
        if: startsWith(github.ref, 'refs/tags/v')
        uses: softprops/action-gh-release@v2
        with:
          draft: true
          name: "STerm SSH ${{ github.ref_name }}"
          body: "Cross-platform native GPUI (pure Rust) builds for macOS and Windows."
          files: |
            dist-release/*.zip
            dist-release/*.tar.gz

[workspace]
resolver = "2"
members = [
    "crates/core-crypto",
    "crates/core-vault",
    "crates/core-ssh",
    "crates/core-sftp",
    "crates/core-sync",
    "crates/sterm-gpui",
    "server/sync-server",
]

[workspace.package]
version = "0.1.0"
edition = "2021"

[workspace.dependencies]
aes-gcm = "0.10"
argon2 = "0.5"
async-trait = "0.1"
axum = "0.8"
base64 = "0.22"
chrono = { version = "0.4", features = ["serde"] }
dashmap = "6"
dirs = "5"
hkdf = "0.12"
jsonwebtoken = "9"
rand = "0.8"
reqwest = { version = "0.12", default-features = false, features = ["json", "rustls-tls"] }
rusqlite = { version = "0.32", features = ["bundled"] }
russh = { version = "0.65", default-features = false, features = ["flate2", "ring", "rsa"] }
russh-sftp = "2.1"
serde = { version = "1", features = ["derive"] }
serde_json = "1"
sha2 = "0.10"
socket2 = "0.6"
ssh-key = { version = "0.6", features = ["ed25519", "rsa", "rand_core", "encryption"] }
thiserror = "2"
tokio = { version = "1", features = ["full"] }
tokio-util = "0.7"
tower-http = { version = "0.6", features = ["cors", "trace"] }
tracing = "0.1"
tracing-subscriber = { version = "0.3", features = ["env-filter"] }
uuid = { version = "1.11", features = ["v7", "v4", "serde"] }
zeroize = { version = "1.8", features = ["derive"] }
